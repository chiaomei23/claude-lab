<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巧妹的 Wonderland</title>
<style>
  :root {
    --void: #050a24;
    --navy: #0b1445;
    --indigo: #1d1a5e;
    --violet: #6a35c9;
    --lilac: #b9a2ff;
    --pink: #ff5fb8;
    --blush: #ffb3dd;
    --ice: #bfe3ff;
    --star: #ffffff;
    --text: #f5f3ff;
    --muted: #c4c6ee;
    --radius: 28px;
    --glass: linear-gradient(160deg, rgba(120,110,255,.16), rgba(255,95,184,.06) 60%, rgba(10,16,60,.35));
    --edge: rgba(190,175,255,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(44rem 30rem at 85% 8%, rgba(106,53,201,.55), transparent 65%),
      radial-gradient(40rem 30rem at 8% 30%, rgba(255,95,184,.28), transparent 65%),
      radial-gradient(52rem 34rem at 70% 62%, rgba(40,70,200,.35), transparent 65%),
      radial-gradient(60rem 36rem at 25% 108%, rgba(255,95,184,.30), transparent 65%),
      linear-gradient(180deg, var(--void) 0%, var(--navy) 42%, var(--indigo) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* 星空：三層不同大小與節奏的星點 */
  body::before, body::after {
    content: "";
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    background-image:
      radial-gradient(1px 1px at 22px 34px, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 96px 120px, rgba(255,255,255,.8) 50%, transparent 100%),
      radial-gradient(1.2px 1.2px at 170px 60px, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 60px 210px, rgba(191,227,255,.9) 50%, transparent 100%),
      radial-gradient(1px 1px at 205px 188px, rgba(255,255,255,.7) 50%, transparent 100%),
      radial-gradient(1.2px 1.2px at 130px 250px, rgba(255,179,221,.9) 50%, transparent 100%),
      radial-gradient(1px 1px at 12px 140px, rgba(255,255,255,.75) 50%, transparent 100%),
      radial-gradient(1px 1px at 232px 20px, #fff 50%, transparent 100%);
    background-size: 240px 280px;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(2px 2px at 80px 70px, #fff 40%, transparent 100%),
      radial-gradient(2.4px 2.4px at 310px 190px, var(--blush) 40%, transparent 100%),
      radial-gradient(2px 2px at 180px 330px, var(--ice) 40%, transparent 100%),
      radial-gradient(2.6px 2.6px at 380px 40px, #fff 40%, transparent 100%),
      radial-gradient(2px 2px at 440px 300px, #fff 40%, transparent 100%),
      radial-gradient(1.6px 1.6px at 40px 260px, var(--lilac) 40%, transparent 100%);
    background-size: 470px 390px;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.8));
    animation: twinkle 4s ease-in-out 1.2s infinite alternate;
  }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  main {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: clamp(3rem, 9vw, 5.5rem) 1.5rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* 星系光圈 */
  .portal {
    width: clamp(140px, 28vw, 190px);
    aspect-ratio: 1;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle, #fff 0 6%, rgba(255,179,221,.9) 14%, transparent 34%),
      conic-gradient(from 0deg, var(--pink), var(--violet), #2b4fd8, var(--lilac), var(--pink));
    -webkit-mask: radial-gradient(circle, #000 28%, transparent 70%);
            mask: radial-gradient(circle, #000 28%, transparent 70%);
    box-shadow: 0 0 80px 10px rgba(106,53,201,.6);
    animation: spin 40s linear infinite;
  }
  .portal::after {
    content: "";
    position: absolute; inset: 14%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: 0 0 24px rgba(255,95,184,.5), inset 0 0 24px rgba(106,53,201,.5);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 標題 */
  h1 {
    margin-top: 2rem;
    font-size: clamp(2.4rem, 7.5vw, 4.4rem);
    font-weight: 800;
    letter-spacing: .03em;
    line-height: 1.15;
    background: linear-gradient(90deg, #fff 0%, var(--blush) 30%, var(--lilac) 62%, var(--ice) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(185,162,255,.5));
  }
  .sub {
    margin-top: 1.1rem;
    padding: .4rem 1.3rem;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: rgba(20,24,80,.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: .16em;
  }

  /* 創作卡片 */
  .works {
    margin-top: clamp(2.75rem, 7vw, 4.5rem);
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  .work {
    position: relative;
    padding: 1.75rem 1.6rem 1.9rem;
    border-radius: var(--radius);
    text-align: left;
    background: var(--glass), rgba(8,12,48,.55);
    border: 1px solid var(--edge);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 44px -14px rgba(2,4,24,.8);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .work:hover {
    transform: translateY(-6px);
    border-color: rgba(255,255,255,.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 26px 50px -14px var(--glow);
  }
  .icon {
    width: 54px; height: 54px;
    margin-bottom: 1.25rem;
    border-radius: 18px;
    display: grid; place-items: center;
    background: var(--g);
    box-shadow: 0 8px 26px -4px var(--glow);
  }
  .icon svg { width: 27px; height: 27px; stroke: var(--void); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .music  { --g: linear-gradient(135deg, var(--pink), var(--blush)); --glow: rgba(255,95,184,.6); }
  .dance  { --g: linear-gradient(135deg, var(--ice), var(--lilac));   --glow: rgba(150,170,255,.55); }
  .paint  { --g: linear-gradient(135deg, #fff, var(--lilac));         --glow: rgba(185,162,255,.55); }
  .work h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: .1em; line-height: 1.3; margin-bottom: .5rem; }
  .work p { color: var(--muted); font-size: 1rem; line-height: 1.8; }

  /* 名言 */
  blockquote {
    margin-top: clamp(1.5rem, 4vw, 2rem);
    width: 100%;
    max-width: 680px;
    padding: clamp(1.75rem, 5vw, 2.5rem) clamp(1.5rem, 5vw, 2.75rem);
    border-radius: 32px;
    background: var(--glass), rgba(8,12,48,.55);
    border: 1px solid var(--edge);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 44px -14px rgba(2,4,24,.8);
  }
  blockquote p {
    font-size: clamp(1.2rem, 3.4vw, 1.55rem);
    font-weight: 600;
    line-height: 1.75;
    color: #fff;
    text-shadow: 0 0 26px rgba(255,179,221,.45);
  }
  blockquote .en {
    margin-top: .75rem;
    font-size: 1rem;
    font-weight: 400;
    font-style: italic;
    line-height: 1.7;
    color: var(--muted);
    text-shadow: none;
  }
  blockquote cite {
    display: block;
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(190,175,255,.22);
    font-style: normal;
    font-size: .92rem;
    letter-spacing: .06em;
    color: var(--blush);
  }

  @media (max-width: 760px) {
    .works { grid-template-columns: 1fr; max-width: 420px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .portal, body::before, body::after { animation: none; }
    .work { transition: none; }
    .work:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <div class="portal" role="img" aria-label="發光的入口光圈"></div>
  <h1>巧妹的 Wonderland</h1>
  <p class="sub">音樂．舞蹈．繪畫</p>

  <section class="works" aria-label="創作">
    <article class="work music">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
      <h2>音樂</h2>
      <p>把心情譜成會發光的旋律。</p>
    </article>
    <article class="work dance">
      <div class="icon"><svg viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="2"/><path d="M13 7.5c0 4-2 5-5 8M13 7.5c1 3 4 4 6 3M10 14l3 3 3 4"/></svg></div>
      <h2>舞蹈</h2>
      <p>讓身體在兔子洞裡自由墜落。</p>
    </article>
    <article class="work paint">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M20 4c-6 1-10 5-12 10l2 2c5-2 9-6 10-12z"/><path d="M8 14c-2.5 0-4 1.5-4 4 0 1.5-.5 2-1 2.5 3 .5 7 0 7-4"/></svg></div>
      <h2>繪畫</h2>
      <p>用顏色畫出沒有地圖的地方。</p>
    </article>
  </section>

  <blockquote>
    <p>回到昨天沒有用，因為那時的我是另一個人了。</p>
    <p class="en">It’s no use going back to yesterday, because I was a different person then.</p>
    <cite>— 路易斯・卡羅《愛麗絲夢遊仙境》</cite>
  </blockquote>
</main>
</body>
</html>
